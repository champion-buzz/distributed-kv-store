name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run tests
        run: mvn -B package
      - name: Benchmark (load balancing strategies)
        run: |
          java -Dkvstore.readCostMicros=500 -cp target/kvstore.jar com.kvstore.bench.Benchmark 64 300 4 | tee benchmark.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
